<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 24px; background: #f5f7fc; color: #1f2340; font-family: 'Lexend', system-ui, sans-serif;">

      <span class="ms" aria-hidden="true" style="font-size: 20px;">bedtime</span>Jam tidur Tama

      <button aria-label="Tidur jam 21.00. Ubah" style="height: 72px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 0 16px; border: 2px solid #1f2340; border-radius: 16px; background: #ffffff; color: #1f2340; box-shadow: 0 4px 0 #1f2340;">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { suara: true, getar: false, gerak: false };
  }
  renderVals() {
    const defs = [
      { key: 'suara', icon: 'volume_up', label: 'Suara' },
      { key: 'getar', icon: 'vibration', label: 'Getar' },
      { key: 'gerak', icon: 'motion_photos_paused', label: 'Kurangi gerak' }
    ];
    const toggles = defs.map((d) => {
      const on = !!this.state[d.key];
      return {
        id: 'sw-' + d.key,
        icon: d.icon,
        label: d.label,
        on: on,
        off: !on,
        toggle: () => this.setState({ [d.key]: !on })
      };
    });
    return { toggles };
  }
}
</script>
